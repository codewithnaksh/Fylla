<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FYLLA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root">
      <header>
        <div class="left">
          <div class="logo-container">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="sq-fill"></div>
          </div>
          <a href="#">FYLLA</a>
        </div>
        <div class="right">
          <div class="links">
            <ul>
              <li><a href="#services">Services</a></li>
              <li><a href="#work">work</a></li>
              <li><a href="#studio">sudio</a></li>
              <li><a href="#blog">blog</a></li>
              <li><a href="#pages">pages</a></li>
            </ul>
          </div>
          <div class="lets-talk-container">
            <button class="lets-talk">Let's talk</button>
          </div>
          <div class="seperator"></div>
          <div class="theme-toggle">🌙</div>

          <div class="circular-buttons">
            <button>IN</button>
            <button>PI</button>
            <button>TW</button>
          </div>
          <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
          </div>
        </div>
      </header>
      <div id="view1">
        <div class="view1-container">
          <div class="view1-subgroup">
            <p>about us</p>
            <h2>Creative studio that inspires.</h2>
          </div>
          <div class="view1-hero-img-container">
            <img src="./main-img.webp" alt="hero image" />
          </div>
        </div>
        <div class="view1-subgroup">
          <p>our values</p>
          <h2>Our vision is to connect with the world through innovation.</h2>
        </div>
      </div>
    </div>
